minimum_pre_commit_version: "3.0.0"
repos:
  - repo: local
    hooks:
      - id: static-sync-guard
        name: static sync guard
        entry: uv run python tools/verify/static_sync_guard.py
        language: system
        pass_filenames: false
        always_run: true
      - id: verify-quick
        name: verify --quick
        entry: uv run python tools/verify/verify.py --quick
        language: system
        pass_filenames: false
        always_run: true
