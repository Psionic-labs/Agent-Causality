name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "agent-causality-site/**"
      - "research_paper/agentic_causality_paper.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish agent-causality-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Copy the research paper into the site
        run: cp research_paper/agentic_causality_paper.pdf agent-causality-site/agentic_causality_paper.pdf

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: agent-causality-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
