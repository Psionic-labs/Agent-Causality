[project]
name = "agent-causality"
version = "0.2.1"
description = "Causal capture SDK for branching multi-agent systems"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Psionic-labs/Agent-Causality"
Repository = "https://github.com/Psionic-labs/Agent-Causality"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
explain = ["httpx>=0.27.0"]
langgraph = ["langchain-core>=0.3.0"]
all = ["psycopg[binary]>=3.2.0", "httpx>=0.27.0", "langchain-core>=0.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adapters*", "benchmark*", "causality*", "cli*", "core*", "explorer*", "sdk*", "storage*", "examples*"]

[tool.setuptools.package-data]
benchmark = ["ground_truth/*.json"]
"benchmark.opencode" = ["ground_truth/*.json"]
explorer = ["demo/*.json", "static/*", "static/**/*"]

[project.scripts]
causality = "cli.main:main"
agent-causality = "cli.main:main"
causality-benchmark = "benchmark.runner:main"
causality-opencode-ingest = "adapters.opencode.server:main"
causality-explorer = "explorer.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.4.0",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires a reachable PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "fixture",
    ".agents",
    ".opencode",
    ".causality",
    ".next",
    ".pytest_cache",
    ".ruff_cache",
    ".taste-skill",
    ".uv-cache",
    ".venv",
    "agent_causality.egg-info",
    "brag-output",
    "dist",
    "explorer/static",
    "frontend",
    "node_modules",
    "paper",
    "test_pics",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
root = ["."]

[tool.ty.src]
exclude = [
    ".agents",
    ".opencode",
    ".causality",
    ".next",
    ".pytest_cache",
    ".ruff_cache",
    ".taste-skill",
    ".uv-cache",
    ".venv",
    "agent_causality.egg-info",
    "brag-output",
    "dist",
    "explorer/static",
    "frontend",
    "node_modules",
    "paper",
    "test_pics",
]
